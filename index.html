დასავალი</span></div><div class="chips">${skills.map((s,i)=>`<button class="chip ${filter===i?'active':''}" onclick="setSkill(${i})">${s}</button>`).join('')}</div><section class="topic-panel"><label for="topic">🗂️ აირჩიე თემა</label> <select id="topic" onchange="topic=this.value;render()"><option>ყველა თემა</option>${[...new Set(tasks.filter(t=>!filter||t.skill===filter).map(t=>t.topic))].map(x=>`<option ${topic===x?'selected':''}>${x}</option>`).join('')}</select><label class="montessori-filter"><input type="checkbox" ${montessoriOnly?'checked':''} onchange="montessoriOnly=this.checked;render()"> 🌿 მონტესორისგან შთაგონებული</label><span class="tag">${visibleTasks().length} აქტივობა</span></section><div class="grid">${visibleTasks().map(card).join('')||'<div class="empty">🌱 აქ ჯერ აქტივობა არ არის. სცადე სხვა თემა ან მოხსენი ფილტრი.</div>'}</div><section class="bottom"><div><h3 style="margin:0">🌱 პატარა ნაბიჯები, შენი საკუთარი გზა</h3><p>აქ არავინ გეჯიბრება. სცადე შენი ტემპით და აღმოაჩინე, რა მოგწონს.</p></div><button class="round" onclick="parentInfo()">უფროსებისთვის ↗</button></section>`}else if(page==='interests'){app.innerHTML=`<span class="eyebrow">ჩემი აღმოჩენების კოლექცია</span><h1>რა მოგწონს ყველაზე მეტად?</h1><p>აქტივობის ბოლოს დააჭირე გულს. აქ შენს საყვარელ თავგადასავლებს შეინახავ.</p>${data.likes.length?`<div class="grid">${tasks.filter(t=>data.likes.includes(t.id)).map(card).join('')}</div>`:'<div class="empty">🧭<h2>წინ ბევრი აღმოჩენაა!</h2><p>სცადე სხვადასხვა აქტივობა და მონიშნე, რისი კეთება მოგინდა კიდევ.</p><button class="primary" onclick="go(\'home\')">ავირჩიოთ აქტივობა</button></div>'}`}else{const n=Object.keys(data.done).length;app.innerHTML=`<span class="eyebrow">ყველა ცდას აქვს მნიშვნელობა</span><h1>შენი აღმოჩენების გზა 🌱</h1><p>ეს შენი მოგზაურობაა. შეგიძლია ნებისმიერ აქტივობას დაუბრუნდე.</p><div class="stats"><div class="stat"><strong>${n}</strong>შესრულებული აქტივობა</div><div class="stat"><strong>${data.likes.length}</strong>საყვარელი თავგადასავალი</div><div class="stat"><strong>${new Set(tasks.filter(t=>data.done[t.id]).map(t=>t.skill)).size} / 6</strong>გამოცდილი მიმართულება</div></div><div class="grid">${skills.slice(1).map((s,i)=>{let all=tasks.filter(t=>t.skill===i+1),done=all.filter(t=>data.done[t.id]).length;return `<div class="stat"><h3>${s}</h3><div class="bar"><span style="width:${done/all.length*100}%"></span></div><p>${done} / ${all.length} აქტივობა გამოცადე</p></div>`}).join('')}</div><p class="note">პროგრესი ინახება მხოლოდ ამ ბრაუზერში. ეს ჩანაწერები უნარის შეფასება ან ტესტის ქულა არ არის.</p>`}}function go(p){page=p;render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function openTask(id){current=tasks.find(t=>t.id===id);selected=[];stage=0;showTask();modal.showModal()}function showTask(){const t=current;document.getElementById('activity').innerHTML=`<span class="tag">${t.icon} ${skills[t.skill]} · ${t.time} წუთი</span><h2 style="margin-top:15px">${t.title}</h2><div class="task-tags"><span>${t.topic}</span>${t.montessori?'<span>🌿 მონტესორის შთაგონებით</span>':''}</div>${!stage&&t.materials?`<div class="materials">🧺 <strong>მოამზადე:</strong> ${t.materials}<br><small>აირჩიე მშვიდი ადგილი, იმუშავე შენს ტემპში და ბოლოს მასალა დაალაგე.</small></div>`:''}<div class="step">${stage?t.next:t.prompt}</div>${stage?`${t.control?`<details class="selfcheck"><summary>🔎 თვითონ გადაამოწმე</summary><p>${t.control}</p></details>`:''}<label for="reflection">ჩემი აღმოჩენა <small>(სურვილისამებრ)</small></label><textarea id="reflection" placeholder="დაწერე ან უფროსს ჩააწერინე...">${esc(data.done[t.id]?.text||'')}</textarea><p class="note">შეგიძლია პასუხი უბრალოდ ხმამაღლაც თქვა.</p><button class="primary" onclick="finish()">დავასრულე ჩემი ცდა ✓</button>`:t.type==='draw'?`<canvas id="drawing" width="550" height="260" aria-label="ხატვის დაფა"></canvas><div class="swatches">${['#426947','#e89043','#8570b0','#4a9aba','#d46f83'].map(c=>`<button aria-label="ფერი ${c}" style="background:${c}" onclick="color='${c}'"></button>`).join('')}<button style="width:auto;border-radius:8px" onclick="document.getElementById('drawing').getContext('2d').clearRect(0,0,550,260)">გასუფთავება</button></div><button class="primary" onclick="next()">ჩემი ნახატი მზადაა →</button>`:t.options?`<div class="options">${t.options.map((o,i)=>`<button id="opt${i}" class="option" onclick="choose(${i})">${o}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button class="primary" onclick="check()">გავაგრძელოთ →</button>`:`<textarea id="idea" placeholder="შეგიძლია აქ ჩაინიშნო იდეები ან ხმამაღლა თქვა..."></textarea><p class="note">დავალება ჯერ შეასრულე, მერე გააგრძელე.</p><button class="primary" onclick="next()">გამოვცადე →</button>`}`;if(!stage&&t.type==='draw'){let canvas=document.getElementById('drawing'),ctx=canvas.getContext('2d'),down=false;canvas.onpointerdown=e=>{down=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();let r=canvas.getBoundingClientRect();ctx.moveTo((e.clientX-r.left)*550/r.width,(e.clientY-r.top)*260/r.height)};canvas.onpointermove=e=>{if(!down)return;let r=canvas.getBoundingClientRect();ctx.strokeStyle=color;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineTo((e.clientX-r.left)*550/r.width,(e.clientY-r.top)*260/r.height);ctx.stroke()};canvas.onpointerup=canvas.onpointercancel=()=>down=false}}function choose(i){if(current.type==='multi'){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i)}else selected=[i];current.options.forEach((_,j)=>document.getElementById('opt'+j).classList.toggle('selected',selected.includes(j)))}function check(){const f=document.getElementById('feedback');if(!selected.length){f.textContent='აირჩიე პასუხი, რომელიც შენს აზრს ყველაზე მეტად შეესაბამება.';return}if(current.type==='multi'&&selected.length!==3){f.textContent='აირჩიე 3 ნივთი. შეგიძლია არჩევანი შეცვალო.';return}if(current.type==='quiz'&&selected[0]!==current.correct){f.textContent='კიდევ დაფიქრდი: გვჭირდება ფრინველი, რომელიც ვერ დაფრინავს. შეგიძლია თავიდან სცადო.';return}next()}let drawing=null;function next(){drawing=current.type==='draw'?document.getElementById('drawing')?.toDataURL():null;stage=1;showTask();if(drawing){const img=document.createElement('img');img.src=drawing;img.alt='შენი ნახატი';img.style.width='100%';document.querySelector('#activity .step').after(img)}}function finish(){data.done[current.id]={text:document.getElementById('reflection')?.value??data.done[current.id]?.text??'',date:new Date().toISOString()};save();document.getElementById('activity').innerHTML=`<div class="empty celebration"><div class="confetti" aria-hidden="true">${Array.from({length:16},(_,i)=>`<span style="--x:${i*6.5}%;--delay:${i%4*.1}s">${["⭐","🎉","💜","✨"][i%4]}</span>`).join('')}</div><span class="success-star">🌟</span><h2>კიდევ ერთი აღმოჩენა!</h2><p>რა მოგეწონა ამ ცდაში? შენი იდეა ოჯახსაც გაუზიარე.</p><button class="primary" onclick="like()">${data.likes.includes(current.id)?'♥ შენს ინტერესებშია':'♡ ამის კეთება კიდევ მინდა'}</button><p><button class="round" onclick="modal.close();render()">სხვა თავგადასავლები →</button></p></div>`;render()}function like(){if(!data.likes.includes(current.id))data.likes.push(current.id);save();finish()}function parentInfo(){document.getElementById('activity').innerHTML='<h2>ერთად აღმოაჩინეთ 🌱</h2><p>აქტივობები განკუთვნილია 6 წლიდან ბავშვებისთვის. უმცროს მკითხველს წაუკითხეთ ინსტრუქცია და პასუხი სურვილისამებრ ჩაუწერეთ.</p><div class="step">ჰკითხეთ: „რას ფიქრობ?“, „როგორ შეამოწმებდი?“, „კიდევ რა გზა არსებობს?“ მიეცით მოფიქრების დრო და დააფასეთ მცდელობა.</div><p>წყალთან, ხელსაწყოებთან და გარეთ შესასრულებელ მისიებში უფროსის დახმარებაა საჭირო. დავალების შემდეგ შეგიძლიათ შეისვენოთ.</p><h3>🌿 მონტესორის შთაგონებით</h3><p>ბავშვი თავად ირჩევს საქმეს; უფროსი მოკლედ აჩვენებს, შემდეგ უკან იხევს და მხოლოდ საჭიროებისას ეხმარება. მოამზადეთ ხელმისაწვდომი მასალა, მიეცით გამეორებისა და დამოუკიდებლად გადამოწმების დრო. ბოლოს ნივთები თავის ადგილზე ბრუნდება.</p><p>ეს არის მონტესორის პრინციპებით შთაგონებული დამატებითი აქტივობები და არა სრული მონტესორის პროგრამა. დრო მხოლოდ ორიენტირია; ჩქარობა არ არის საჭირო.</p><p><a href="https://amshq.org/about-us/inside-the-montessori-classroom/elementary/" target="_blank" rel="noopener">American Montessori Society: 6–12 წლის პროგრამა ↗</a></p><p>აპლიკაცია არ ითხოვს ბავშვის სახელს, ფოტოს ან ელფოსტას. ჩანაწერები მხოლოდ ამ ბრაუზერში ინახება. არ არის ჩატი, რეკლამა ან შეჯიბრების რეიტინგი.</p><p class="note">მიმართულებების რაოდენობა მხოლოდ გამოცდილ აქტივობებს აჩვენებს და ბავშვის უნარებს არ ზომავს.</p>';modal.showModal()}render();
</script></html>
